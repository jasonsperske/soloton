name: CI

# Every push and pull request: run checks and build a debug APK of every app.
# Push to main also builds release APKs and refreshes the rolling `latest` prerelease.
# Apps are discovered from apps/*/android, so adding an app needs no edit here.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # One run per branch or PR. Superseded runs are cancelled, except on main, where runs
  # queue so that `latest` is always published from the newest commit.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      version-code: ${{ steps.version.outputs.code }}
      version-name: ${{ steps.version.outputs.name }}
      short-sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: versionCode is the commit count
          persist-credentials: false

      - name: Find apps
        id: apps
        run: |
          apps=()
          for dir in apps/*/android; do
            [ -f "$dir/build.gradle.kts" ] || continue
            app=${dir#apps/}
            app=${app%/android}
            if [[ ! "$app" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "::error::App directory name '$app' must be lowercase letters, digits, '-' or '_'."
              exit 1
            fi
            apps+=("$app")
          done
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No apps found (expected apps/<app>/android/build.gradle.kts)."
            exit 1
          fi
          json=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -cs .)
          echo "Apps: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          short=$(git rev-parse --short=7 HEAD)
          echo "versionCode=$count versionName=dev-$count-$short"
          {
            echo "code=$count"
            echo "name=dev-$count-$short"
            echo "short-sha=$short"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run checks
        run: ./gradlew check

  debug-apk:
    name: Debug APK (${{ matrix.app }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build debug APK
        id: build
        env:
          APP: ${{ matrix.app }}
          SHORT_SHA: ${{ needs.discover.outputs.short-sha }}
          SOLOTON_VERSION_CODE: ${{ needs.discover.outputs.version-code }}
          SOLOTON_VERSION_NAME: ${{ needs.discover.outputs.version-name }}
        run: |
          ./gradlew ":apps:$APP:android:assembleDebug"
          mkdir -p dist
          cp "apps/$APP/android/build/outputs/apk/debug/android-debug.apk" "dist/$APP-$SHORT_SHA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Uploaded as the bare file, so the artifact is named <app>-<short sha>.apk.
          path: dist/${{ matrix.app }}-${{ needs.discover.outputs.short-sha }}.apk
          archive: false
          if-no-files-found: error

  emulator-smoke:
    # Roadwork on an emulator shaped like the Peloton Bike gen 1 tablet (docs/DEVICE.md; same profile as
    # scripts/gen1-emulator.sh): API 24, 1920x1080 landscape, 160 dpi, 2 GB RAM, 4 cores.
    # Launch, stay up 60 s, GL surface drawing, screenshot. The screenshot and test report are uploaded as the roadwork-emulator-smoke artifact.
    name: Emulator smoke test (roadwork, gen 1 tablet profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Per the android-emulator-runner README: let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before the emulator starts, so it is not idling during compilation.
      - name: Build app and test APKs
        run: ./gradlew :apps:roadwork:android:assembleDebug :apps:roadwork:android:assembleDebugAndroidTest

      - name: Run smoke test on an API 24 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel
          ram-size: 2048M
          cores: 4
          disable-animations: true
          # -skin: the bike's 1920x1080 landscape display.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1920x1080
          # Each line runs on its own; the run fails at the first failing line.
          script: |
            adb shell wm density 160
            ./gradlew :apps:roadwork:android:connectedDebugAndroidTest
            adb pull /sdcard/roadwork-smoke.png roadwork-emulator-smoke.png

      - name: Upload screenshot and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadwork-emulator-smoke
          path: |
            roadwork-emulator-smoke.png
            apps/roadwork/android/build/reports/androidTests/connected/
            apps/roadwork/android/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  release-apks:
    name: Release APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [discover, check, debug-apk]
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build release APKs
        id: build
        env:
          APPS: ${{ needs.discover.outputs.apps }}
          HAVE_SIGNING: ${{ secrets.SOLOTON_KEYSTORE_B64 != '' && secrets.SOLOTON_KEYSTORE_PASSWORD != '' && secrets.SOLOTON_KEY_ALIAS != '' && secrets.SOLOTON_KEY_PASSWORD != '' }}
          SOLOTON_KEYSTORE_B64: ${{ secrets.SOLOTON_KEYSTORE_B64 }}
          SOLOTON_KEYSTORE_PASSWORD: ${{ secrets.SOLOTON_KEYSTORE_PASSWORD }}
          SOLOTON_KEY_ALIAS: ${{ secrets.SOLOTON_KEY_ALIAS }}
          SOLOTON_KEY_PASSWORD: ${{ secrets.SOLOTON_KEY_PASSWORD }}
          SOLOTON_VERSION_CODE: ${{ needs.discover.outputs.version-code }}
          SOLOTON_VERSION_NAME: ${{ needs.discover.outputs.version-name }}
        run: |
          if [ "$HAVE_SIGNING" != "true" ]; then
            echo "::warning title=Debug signing::Signing secrets are not set; release APKs are signed with the debug key. See docs/CI_SETUP.md."
          fi
          echo "signed=$HAVE_SIGNING" >> "$GITHUB_OUTPUT"
          mapfile -t apps < <(jq -r '.[]' <<< "$APPS")
          tasks=()
          for app in "${apps[@]}"; do tasks+=(":apps:$app:android:assembleRelease"); done
          ./gradlew "${tasks[@]}"
          mkdir -p dist
          for app in "${apps[@]}"; do
            cp "apps/$app/android/build/outputs/apk/release/android-release.apk" "dist/$app.apk"
          done
          ls -l dist

      - name: Upload release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  publish-latest:
    name: Publish latest prerelease
    needs: [discover, release-apks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: latest-apks
          path: dist

      - name: Update latest tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          SHORT_SHA: ${{ needs.discover.outputs.short-sha }}
          VERSION_CODE: ${{ needs.discover.outputs.version-code }}
          VERSION_NAME: ${{ needs.discover.outputs.version-name }}
          SIGNED: ${{ needs.release-apks.outputs.signed }}
        run: |
          set -euo pipefail

          # A re-run of an old workflow must not roll `latest` back.
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::main is now at $head; not publishing $SHA as latest."
            exit 0
          fi

          commit_date=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.committer.date)
          if [ "$SIGNED" = "true" ]; then
            signing="Signed with the repository release key."
          else
            signing="Signed with a **debug key** (signing secrets not set): uninstall before installing a build signed with the release key."
          fi
          {
            echo "Rolling build of \`main\`. Replaced on every push; not a stable release."
            echo
            echo "- Commit: [\`$SHORT_SHA\`]($SERVER/$REPO/commit/$SHA) ($SHA)"
            echo "- Commit date: $commit_date"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- versionCode $VERSION_CODE, versionName \`$VERSION_NAME\`"
            echo "- $signing"
            echo
            echo "Download \`<app>.apk\` below, or use $SERVER/$REPO/releases/download/latest/<app>.apk"
          } > notes.md

          # Point the `latest` tag at this commit.
          if gh api "repos/$REPO/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/latest" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/latest -f sha="$SHA" > /dev/null
          fi

          title="Latest build ($SHORT_SHA)"
          if gh release view latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit latest --repo "$REPO" --prerelease --title "$title" --notes-file notes.md
            gh release upload latest --repo "$REPO" --clobber dist/*.apk
            # Remove assets for apps that no longer exist, so the assets are exactly dist/*.apk.
            gh release view latest --repo "$REPO" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                if [ ! -f "dist/$asset" ]; then
                  echo "Removing stale asset $asset"
                  gh release delete-asset latest "$asset" --repo "$REPO" --yes
                fi
              done
          else
            gh release create latest --repo "$REPO" --prerelease --verify-tag \
              --title "$title" --notes-file notes.md dist/*.apk
          fi
          echo "Published:"
          printf '  %s/%s/releases/download/latest/%s\n' "$SERVER" "$REPO" dist/*.apk | sed 's#/dist/#/#'

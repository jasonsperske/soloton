name: Release

# Tag <app>-v<semver> (for example roadwork-v0.1.0) builds that app's release APK and
# attaches it to a GitHub Release named after the tag, as <app>-<semver>.apk.

on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version-code: ${{ steps.tag.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: versionCode is the commit count
          persist-credentials: false

      - name: Parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
          if [[ ! "$TAG" =~ ^([a-z0-9][a-z0-9_-]*)-v($semver)$ ]]; then
            echo "::error::Tag '$TAG' is not <app>-v<semver>, for example roadwork-v0.1.0."
            exit 1
          fi
          app=${BASH_REMATCH[1]}
          version=${BASH_REMATCH[2]}
          prerelease=false
          [ -n "${BASH_REMATCH[6]}" ] && prerelease=true
          if [ ! -f "apps/$app/android/build.gradle.kts" ]; then
            known=$(for d in apps/*/android; do [ -f "$d/build.gradle.kts" ] && basename "$(dirname "$d")"; done | paste -sd ' ' -)
            echo "::error::Tag '$TAG' names app '$app', but apps/$app/android does not exist. Known apps: $known"
            exit 1
          fi
          code=$(git rev-list --count HEAD)
          echo "app=$app version=$version prerelease=$prerelease versionCode=$code"
          {
            echo "app=$app"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "version-code=$code"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Release APK
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build release APK
        id: build
        env:
          APP: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
          HAVE_SIGNING: ${{ secrets.SOLOTON_KEYSTORE_B64 != '' && secrets.SOLOTON_KEYSTORE_PASSWORD != '' && secrets.SOLOTON_KEY_ALIAS != '' && secrets.SOLOTON_KEY_PASSWORD != '' }}
          SOLOTON_KEYSTORE_B64: ${{ secrets.SOLOTON_KEYSTORE_B64 }}
          SOLOTON_KEYSTORE_PASSWORD: ${{ secrets.SOLOTON_KEYSTORE_PASSWORD }}
          SOLOTON_KEY_ALIAS: ${{ secrets.SOLOTON_KEY_ALIAS }}
          SOLOTON_KEY_PASSWORD: ${{ secrets.SOLOTON_KEY_PASSWORD }}
          SOLOTON_VERSION_CODE: ${{ needs.resolve.outputs.version-code }}
          SOLOTON_VERSION_NAME: ${{ needs.resolve.outputs.version }}
        run: |
          if [ "$HAVE_SIGNING" != "true" ]; then
            echo "::warning title=Debug signing::Signing secrets are not set; $APP-$VERSION.apk is signed with the debug key. See docs/CI_SETUP.md."
          fi
          echo "signed=$HAVE_SIGNING" >> "$GITHUB_OUTPUT"
          ./gradlew ":apps:$APP:android:assembleRelease"
          mkdir -p dist
          cp "apps/$APP/android/build/outputs/apk/release/android-release.apk" "dist/$APP-$VERSION.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          APP: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VERSION_CODE: ${{ needs.resolve.outputs.version-code }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          apk="dist/$APP-$VERSION.apk"
          test -f "$apk"
          commit_date=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.committer.date)
          if [ "$SIGNED" = "true" ]; then
            signing="Signed with the repository release key."
          else
            signing="Signed with a **debug key** (signing secrets not set): it will not install over a build signed with the release key."
          fi
          {
            echo "$APP $VERSION"
            echo
            echo "- Commit: [\`${SHA:0:7}\`]($SERVER/$REPO/commit/$SHA) ($SHA)"
            echo "- Commit date: $commit_date"
            echo "- versionCode $VERSION_CODE, versionName \`$VERSION\`"
            echo "- $signing"
            echo
            echo "Install: \`adb install -r $APP-$VERSION.apk\`, or see docs/INSTALL.md."
          } > notes.md

          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "$apk"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
              --notes-file notes.md "${flags[@]}" "$apk"
          fi
